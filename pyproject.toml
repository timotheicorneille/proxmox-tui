[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-tui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70.0",
    "proxmoxer>=2.0.1",
    "requests>=2.31.0",
]

[project.scripts]
proxmox-tui = "proxmox_tui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["proxmox_tui*"]
